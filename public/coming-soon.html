<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friendly Dentist — În curând</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400&family=Montserrat:wght@300;400;500&display=swap&subset=latin,latin-ext" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url('/cover-fara-text.webp');
      background-size: cover;
      background-position: 65% center;
      background-repeat: no-repeat;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(20, 20, 20, 0.72) 0%,
        rgba(20, 20, 20, 0.45) 60%,
        rgba(20, 20, 20, 0.55) 100%
      );
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }

    .logo {
      height: 64px;
      width: auto;
      margin-bottom: 48px;
      opacity: 0.95;
    }

    .eyebrow {
      font-family: 'Cormorant', serif;
      font-size: 18px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.04em;
      margin: 0 0 12px;
    }

    .heading {
      font-family: 'Cormorant', serif;
      font-size: clamp(52px, 10vw, 100px);
      font-weight: 400;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 0.9;
      letter-spacing: -0.01em;
      margin: 0 0 32px;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: rgba(255, 255, 255, 0.35);
      margin: 0 auto 32px;
    }

    .sub {
      font-size: 15px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.7;
      max-width: 380px;
      margin: 0 0 48px;
    }

    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .contact-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      margin: 0;
    }

    .phone {
      font-size: 22px;
      font-weight: 400;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: opacity 0.2s;
    }

    .phone:hover { opacity: 0.75; }

    .wa {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 32px;
      margin-top: 8px;
      transition: color 0.2s, border-color 0.2s;
    }

    .wa:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.6);
    }

    .wa svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .footer-note {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.04em;
    }

    @media (min-width: 768px) {
      .logo { height: 72px; margin-bottom: 56px; }
      .eyebrow { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg"></div>
    <div class="overlay"></div>

    <div class="content">
      <img src="/logo.webp" alt="Friendly Dentist" class="logo" />

      <p class="eyebrow">o nouă perspectivă asupra stomatologiei</p>
      <h1 class="heading">În curând</h1>
      <div class="divider"></div>

      <p class="sub">
        Lucrăm la ceva special. Între timp, ne poți contacta direct pentru programări.
      </p>

      <div class="contact">
        <p class="contact-label">Programări & informații</p>
        <a href="tel:+40743169796" class="phone">0743 169 796</a>
        <a href="https://wa.me/40743169796" class="wa" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

          Scrie-ne pe WhatsApp
        </a>
      </div>
    </div>

    <p class="footer-note">© 2026 Friendly Dentist · Str. Cezar Bolliac 66, București</p>
  </div>
</body>
</html>
